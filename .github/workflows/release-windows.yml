name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build application
        shell: pwsh
        run: .\build\build_windows.ps1

      - name: Verify application
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\auto-folder.exe'
          if (-not (Test-Path $exe)) {
            throw "Application executable was not created: $exe"
          }
          Get-Item $exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $script = Join-Path $env:GITHUB_WORKSPACE 'build\installer.iss'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\auto-folder.exe'

          Write-Host "ISCC: $iscc"
          Write-Host "Script: $script"
          Write-Host "Application: $exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          if (-not (Test-Path $script)) {
            throw "installer.iss not found: $script"
          }
          if (-not (Test-Path $exe)) {
            throw "auto-folder.exe not found: $exe"
          }

          & $iscc $script

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }

          $installer = Join-Path $env:GITHUB_WORKSPACE 'dist\auto-folder-setup.exe'
          if (-not (Test-Path $installer)) {
            throw "Installer was not created: $installer"
          }

          Get-Item $installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-folder-windows-installer
          path: dist/auto-folder-setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/auto-folder-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
