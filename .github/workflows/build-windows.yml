name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e .

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build CLI executable
        run: python -m PyInstaller --onefile --name auto-folder --clean --noconfirm --paths src src/auto_folder/main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'build\installer.iss'
          if (-not (Test-Path 'dist\auto-folder-setup.exe')) {
            throw 'dist/auto-folder-setup.exe was not created.'
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $size = (Get-Item 'dist/auto-folder-setup.exe').Length
          Write-Host "Installer size: $size bytes"
          if ($size -le 0) {
            throw 'Installer is empty.'
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: auto-folder-windows-installer
          path: dist/auto-folder-setup.exe
          if-no-files-found: error
