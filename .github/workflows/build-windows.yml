name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e .

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller --onefile --name auto-folder --clean --noconfirm src/auto_folder/main.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/auto-folder.exe')) {
            throw 'dist/auto-folder.exe was not created.'
          }
          $size = (Get-Item 'dist/auto-folder.exe').Length
          Write-Host "Executable size: $size bytes"
          if ($size -le 0) {
            throw 'Executable is empty.'
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: auto-folder-windows-x64
          path: dist/auto-folder.exe
          if-no-files-found: error
